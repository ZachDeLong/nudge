name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: |
          swift build --product nudge-test-matching -c release
          .build/release/nudge-test-matching
          swift test -c release

      # A stable signing identity keeps macOS's Accessibility grant across
      # updates (it's tied to the certificate, not each build's hash). The
      # self-signed certificate lives in repo secrets; this puts it in a
      # throwaway keychain for build-app.sh.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.NUDGE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.NUDGE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::NUDGE_SIGNING_P12 is missing; releases must be signed or users lose their Accessibility grant"; exit 1
          fi
          KC="$RUNNER_TEMP/nudge-signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/nudge-signing.p12"
          security import "$RUNNER_TEMP/nudge-signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/nudge-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          # codesign looks identities up through the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity "$KC"
          # Sign by fingerprint: the self-signed certificate isn't trusted, and
          # lookups by name can skip untrusted identities.
          SHA=$(security find-identity "$KC" | awk '/Nudge Self-Signed/ { print $2; exit }')
          [ -n "$SHA" ] || { echo "::error::signing identity not found after import"; exit 1; }
          echo "NUDGE_SIGN_IDENTITY=$SHA" >> "$GITHUB_ENV"
          echo "NUDGE_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build .app bundle
        run: ./scripts/build-app.sh .build/release

      - name: Check the app is signed with the stable certificate
        run: |
          codesign -d -r- .build/release/Nudge.app 2>&1 | tee /dev/stderr | grep -q 'certificate leaf'             || { echo "::error::Nudge.app isn't signed with the stable certificate"; exit 1; }

      - name: Verify Info.plist version matches tag
        run: |
          PLIST="Resources-Info.plist"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          TAG="${GITHUB_REF##*/}"
          TAG_VERSION="${TAG#v}"
          if [[ "$PLIST_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag $TAG (-> $TAG_VERSION) doesn't match Info.plist version $PLIST_VERSION"
            exit 1
          fi
          echo "Version OK: $PLIST_VERSION"

      - name: Zip app bundle
        run: |
          cd .build/release
          zip -ry Nudge.app.zip Nudge.app

      # `nudge-update --apply` refuses to swap /Applications/Nudge.app unless
      # the download matches this digest. The build is unsigned, so this is the
      # only integrity check standing between a bad asset and the user's Mac.
      - name: Checksum app bundle
        run: |
          cd .build/release
          shasum -a 256 Nudge.app.zip > Nudge.app.zip.sha256
          cat Nudge.app.zip.sha256

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            .build/release/Nudge.app.zip \
            .build/release/Nudge.app.zip.sha256 || \
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            .build/release/Nudge.app.zip \
            .build/release/Nudge.app.zip.sha256
