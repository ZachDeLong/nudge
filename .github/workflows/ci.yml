name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build (release)
        run: swift build -c release

      - name: Run matching test runner
        run: |
          swift build --product nudge-test-matching -c release
          .build/release/nudge-test-matching

      - name: Run XCTest suite
        run: swift test -c release

      - name: Codex hook installer tests
        run: ./Tests/install/codex-hook-test.sh

      # Layer 1: recorded hook payloads through the real nudge-hook into a
      # real, isolated Nudge (its own temp config dir, port and token),
      # answered over the test API. The runner's GUI session hosts the menu
      # bar app. Layers 2 (real claude) and e2e-codex need logins, so they
      # stay local.
      - name: End-to-end (layer 1)
        run: make e2e

      # A stable signing identity keeps macOS's Accessibility grant across
      # updates (it's tied to the certificate, not each build's hash). The
      # self-signed certificate lives in repo secrets; this puts it in a
      # throwaway keychain for build-app.sh.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.NUDGE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.NUDGE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing secret (e.g. a fork PR): keeping ad-hoc signatures"; exit 0
          fi
          KC="$RUNNER_TEMP/nudge-signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/nudge-signing.p12"
          security import "$RUNNER_TEMP/nudge-signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/nudge-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          # codesign looks identities up through the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity "$KC"
          # Sign by fingerprint: the self-signed certificate isn't trusted, and
          # lookups by name can skip untrusted identities.
          SHA=$(security find-identity "$KC" | awk '/Nudge Self-Signed/ { print $2; exit }')
          [ -n "$SHA" ] || { echo "::error::signing identity not found after import"; exit 1; }
          echo "NUDGE_SIGN_IDENTITY=$SHA" >> "$GITHUB_ENV"
          echo "NUDGE_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build .app bundle
        run: ./scripts/build-app.sh .build/release

      - name: Zip app bundle
        run: |
          cd .build/release
          zip -ry Nudge.app.zip Nudge.app

      - name: Upload Nudge.app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nudge.app
          path: .build/release/Nudge.app.zip
          retention-days: 14

  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint scripts
        run: shellcheck --severity=warning scripts/*.sh install.sh
