name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build (release)
        run: swift build -c release

      - name: Run matching test runner
        run: |
          swift build --product nudge-test-matching -c release
          .build/release/nudge-test-matching

      - name: Run XCTest suite
        run: swift test -c release

      - name: Build .app bundle
        run: ./scripts/build-app.sh .build/release

      - name: Zip app bundle
        run: |
          cd .build/release
          zip -ry Nudge.app.zip Nudge.app

      - name: Upload Nudge.app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nudge.app
          path: .build/release/Nudge.app.zip
          retention-days: 14

  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint scripts
        run: shellcheck --severity=warning scripts/*.sh install.sh
